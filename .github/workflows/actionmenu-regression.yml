name: ActionMenu regression test

on:
  push:
    branches:
      - codex/run-actionmenu-regression-test

permissions:
  contents: read

jobs:
  actionmenu-regression:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.65.0-jammy
    steps:
      - name: Check out the test branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run ActionMenu regression test
        run: npm test -- --run packages/react/src/ActionMenu/ActionMenu.test.tsx
